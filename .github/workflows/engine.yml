# Builds KOReader's CREngine library (libkoreader-cre.so) from the
# knuth-plass-history branch of spfenwick/crengine, for each device type
# below, against the koreader-base of the latest KOReader nightly, and
# publishes it on the rolling "engine" release with a manifest.json the
# plugin's updater reads:
#
#   https://github.com/<repo>/releases/download/engine/manifest.json
#
#   { "schema": 2,
#     "crengine": {"repo": "...", "ref": "...", "commit": "<12 hex>"},
#     "builds": { "<fingerprint>": { "<target>": {
#         "file": "...", "url": "...", "sha256": "...", "size": n,
#         "commit": "<12 hex>", "koreader": "<nightly it was built for>",
#         "base": "<koreader-base commit>", "built": "<ISO time>" } } },
#     "bases": { "<koreader-base commit>": "<fingerprint>" } }
#
# Targets are KOReader's names for its builds (Device:otaModel()), which are
# also koreader-base's make targets.
#
# The library only has to agree with the rest of KOReader where they meet:
# cre.cpp (the Lua API KOReader's frontend calls), its build options, and
# the shared libraries it links (of which only lunasvg, a C++ library
# without a versioned soname, can change incompatibly without failing to
# load). The fingerprint is a hash of those parts of koreader-base, so most
# new nightlies need no new build: their koreader-base is just recorded in
# "bases" as using the existing one. A device finds its koreader-base from
# the commit in its version (v2026.07.2-299-g8012773_… → 8012773); with no
# entry for it, the plugin falls back to the newest build and checks it
# against the running engine before installing.
#
# Jobs: plan (what needs building) → build (one per target, in parallel) →
# publish (all at once, so builds don't overwrite each other's manifest).
name: Build engine

on:
  workflow_dispatch:
    inputs:
      koreader_ref:
        description: KOReader commit, tag or branch (empty for the latest nightly)
        required: false
      crengine_ref:
        description: spfenwick/crengine branch, tag or commit
        required: false
        default: knuth-plass-history
      force:
        description: Rebuild even if this build is already published
        type: boolean
        default: false
  # Sent by spfenwick/crengine on a push to knuth-plass-history.
  repository_dispatch:
    types: [crengine-updated]
  # Picks up nightlies with a new koreader-base (otherwise it stops early).
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  # To remove outdated build caches.
  actions: write

# Runs share the "engine" release and its manifest.
concurrency:
  group: engine-release
  cancel-in-progress: false

env:
  CRENGINE_REPO: spfenwick/crengine
  RELEASE_TAG: engine
  GH_TOKEN: ${{ github.token }}
  # Device types, and KOReader's build image for each.
  TARGETS: >-
    [
      {"target": "kobo", "image": "koreader/kokobo:latest"},
      {"target": "kindlepw2", "image": "koreader/kokindle:latest"},
      {"target": "kindlehf", "image": "koreader/kokindle:latest"}
    ]

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      fp: ${{ steps.v.outputs.fp }}
      koreader: ${{ steps.v.outputs.koreader }}
      base: ${{ steps.v.outputs.base }}
      ref: ${{ steps.v.outputs.ref }}
      cre: ${{ steps.v.outputs.cre }}
      cre_short: ${{ steps.v.outputs.cre_short }}
      matrix: ${{ steps.plan.outputs.matrix }}
      builds: ${{ steps.plan.outputs.builds }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Resolve versions
        id: v
        env:
          IN_KOREADER: ${{ inputs.koreader_ref }}
          IN_REF: ${{ inputs.crengine_ref || github.event.client_payload.ref || 'knuth-plass-history' }}
        run: |
          set -euo pipefail
          if [ -n "$IN_KOREADER" ]; then
            ko_ref=$IN_KOREADER
            ko_version=$IN_KOREADER
          else
            # The nightly KOReader's own updater would install (every device
            # type's nightly is built from the same commit).
            zsync="https://ota.koreader.rocks/koreader-kobo-latest-nightly.zsync"
            curl -fsSL --max-time 120 -o nightly.zsync "$zsync"
            name=$(sed -n '1,20{s/^Filename: //p}' nightly.zsync | head -1 | tr -d '\r')
            ko_version=${name#koreader-kobo-}
            ko_version=${ko_version%.targz}
            [[ $ko_version =~ -g([0-9a-f]{7,40})_ ]] || { echo "::error::no commit in nightly name: $name"; exit 1; }
            ko_ref=${BASH_REMATCH[1]}
          fi
          [[ $ko_ref =~ ^[0-9A-Za-z._/-]+$ ]] || { echo "::error::bad KOReader ref: $ko_ref"; exit 1; }
          ref=$IN_REF
          cre=$(gh api "repos/$CRENGINE_REPO/commits/$ref" --jq .sha)
          base=$(gh api "repos/koreader/koreader/contents/base?ref=$ko_ref" --jq .sha)
          # Git's ids of the parts of koreader-base the engine depends on.
          parts=$(
            {
              gh api "repos/koreader/koreader-base/contents?ref=$base" \
                --jq '.[] | select(.name == "cre.cpp" or .name == "cre.h") | .path + " " + .sha'
              gh api "repos/koreader/koreader-base/contents/cmake?ref=$base" \
                --jq '.[] | select(.name == "crengine") | .path + " " + .sha'
              gh api "repos/koreader/koreader-base/contents/thirdparty?ref=$base" \
                --jq '.[] | select(.name == "lunasvg") | .path + " " + .sha'
            } | sort
          )
          echo "$parts"
          [ "$(wc -l <<< "$parts")" -eq 4 ] || { echo "::error::koreader-base layout changed"; exit 1; }
          fp=$(sha256sum <<< "$parts" | cut -c1-16)
          echo "KOReader $ko_version (base $base, fingerprint $fp), crengine $ref @ $cre"
          {
            echo "fp=$fp"
            echo "koreader=$ko_version"
            echo "base=$base"
            echo "ref=$ref"
            echo "cre=$cre"
            echo "cre_short=${cre:0:12}"
          } >> "$GITHUB_OUTPUT"

      # A target needs a build when there's none of this crengine commit for
      # this fingerprint; otherwise at most the koreader-base is recorded.
      - name: Plan
        id: plan
        env:
          FORCE: ${{ inputs.force || false }}
          FP: ${{ steps.v.outputs.fp }}
          BASE: ${{ steps.v.outputs.base }}
          CRE_SHORT: ${{ steps.v.outputs.cre_short }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p manifest.json -O old.json 2>/dev/null \
            || echo '{}' > old.json
          # Builds listed by koreader-base (before schema 2) are dropped.
          jq -e '.schema == 2' old.json >/dev/null || echo '{"schema": 2}' > old.json
          matrix=$(jq -c --argjson targets "$TARGETS" --arg fp "$FP" --arg commit "$CRE_SHORT" \
              --arg force "$FORCE" \
            '. as $m | {include: [$targets[] | select($force == "true"
                                                     or ($m.builds[$fp][.target].commit // "") != $commit)]}' \
            old.json)
          builds=$(jq '.include | length' <<< "$matrix")
          recorded=$(jq -r --arg base "$BASE" '.bases[$base] // ""' old.json)
          publish=false
          if [ "$builds" -gt 0 ] || [ "$recorded" != "$FP" ]; then
            publish=true
          fi
          echo "To build: $(jq -r '[.include[].target] | join(", ")' <<< "$matrix"); publish: $publish"
          {
            echo "matrix=$matrix"
            echo "builds=$builds"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.builds != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      IMAGE: ${{ matrix.image }}
      FP: ${{ needs.plan.outputs.fp }}
      BASE: ${{ needs.plan.outputs.base }}
      CRE: ${{ needs.plan.outputs.cre }}
      CRE_SHORT: ${{ needs.plan.outputs.cre_short }}
    steps:
      # The whole koreader-base tree (sources, crengine checkout and build
      # output) is kept between runs, per target and koreader-base commit: a
      # new crengine commit then only recompiles the files it changed. A new
      # koreader-base (or an evicted cache) starts from scratch, with
      # ccache's help. (Keys use "/" so that "kindle/" doesn't also match
      # "kindlehf/".)
      - name: Restore build tree
        id: tree
        uses: actions/cache/restore@v4
        with:
          path: base
          key: tree/${{ matrix.target }}/${{ needs.plan.outputs.base }}/${{ needs.plan.outputs.cre }}
          restore-keys: |
            tree/${{ matrix.target }}/${{ needs.plan.outputs.base }}/

      - name: Restore compiler cache
        if: steps.tree.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache/${{ matrix.target }}/${{ needs.plan.outputs.base }}
          restore-keys: |
            ccache/${{ matrix.target }}/

      - name: Check out koreader-base
        if: steps.tree.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: koreader/koreader-base
          ref: ${{ needs.plan.outputs.base }}
          path: base

      # In place of base's crengine submodule (the only one it has). A git
      # checkout, so the engine's CMake can read the commit too; in a
      # restored tree, checking out the new commit only touches the files
      # it changed, so only those are rebuilt.
      - name: Check out the Knuth–Plass crengine
        run: |
          set -euo pipefail
          dir=base/thirdparty/kpvcrlib/crengine
          if [ ! -d "$dir/.git" ]; then
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "https://github.com/$CRENGINE_REPO" "$dir"
          fi
          git -C "$dir" fetch --no-tags origin "$CRE"
          git -C "$dir" checkout --force --detach "$CRE"
          git -C "$dir" log --oneline -1

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p ccache
          # Only the engine library and what it needs (crengine, its
          # libraries and LuaJIT), not all of KOReader's. The image's user
          # (ko) has the runner's uid, so it can write the checkout. A login
          # shell puts the toolchain on PATH.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/ko/ws" -w /home/ko/ws/base \
            -e CCACHE_DIR=/home/ko/ws/ccache -e CCACHE_MAXSIZE=2G \
            -e KNUTH_PLASS_BUILD="$CRE_SHORT" \
            "$IMAGE" bash -lc "make TARGET=$TARGET koreader-cre -j$(nproc)"

      # Saved before packaging, so a later failure doesn't lose the build.
      - name: Save build tree
        if: steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: base
          key: tree/${{ matrix.target }}/${{ needs.plan.outputs.base }}/${{ needs.plan.outputs.cre }}

      - name: Save compiler cache
        if: steps.tree.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache/${{ matrix.target }}/${{ needs.plan.outputs.base }}

      # Each crengine commit saves a new tree; keep only the newest.
      - name: Remove older build trees
        if: steps.tree.outputs.cache-hit != 'true'
        env:
          KEEP: tree/${{ matrix.target }}/${{ needs.plan.outputs.base }}/${{ needs.plan.outputs.cre }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "tree/$TARGET/" --limit 100 --json key --jq '.[].key' \
            | { grep -vx "$KEEP" || true; } | while read -r key; do
                gh cache delete -R "$GITHUB_REPOSITORY" "$key" || true
              done

      - name: Package
        run: |
          set -euo pipefail
          # Stripped, as KOReader installs it. Each target builds in its own
          # folder (build/<toolchain>), but a restored tree has only one.
          lib=$(ls base/build/*/libs/libkoreader-cre.so)
          [ "$(wc -l <<< "$lib")" -eq 1 ] || { echo "::error::more than one build: $lib"; exit 1; }
          # The engine must report the commit it was built from.
          strings "$lib" | grep -qx "$CRE_SHORT" \
            || { echo "::error::$lib does not contain the build commit"; exit 1; }
          # Uncompressed: the device installs it as it is (about 2 MB).
          file=libkoreader-cre-$FP-$TARGET.so
          mkdir -p out
          cp "$lib" "out/$file"
          jq -n --arg t "$TARGET" --arg file "$file" \
            --arg sha "$(sha256sum "$lib" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$lib")" \
            '{target: $t, file: $file, sha256: $sha, size: $size}' > "out/$TARGET.json"
          cat "out/$TARGET.json"

      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: out/
          retention-days: 3

  # Runs even if some targets failed to build, to publish the others.
  publish:
    needs: [plan, build]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      FP: ${{ needs.plan.outputs.fp }}
      BASE: ${{ needs.plan.outputs.base }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          path: out
          merge-multiple: true

      - name: Publish
        env:
          KOREADER: ${{ needs.plan.outputs.koreader }}
          REF: ${{ needs.plan.outputs.ref }}
          CRE_SHORT: ${{ needs.plan.outputs.cre_short }}
        run: |
          set -euo pipefail
          mkdir -p out
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Knuth–Plass engine builds" \
              --notes "CREngine builds for the plugin's updater. See manifest.json."
          fi
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p manifest.json -O old.json 2>/dev/null \
            || echo '{}' > old.json
          jq -e '.schema == 2' old.json >/dev/null || echo '{"schema": 2}' > old.json
          # This koreader-base uses this fingerprint's builds.
          jq --arg base "$BASE" --arg fp "$FP" '.bases[$base] = $fp' old.json > manifest.json
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          shopt -s nullglob
          for meta in out/*.json; do
            file=$(jq -r .file "$meta")
            target=$(jq -r .target "$meta")
            # The library first, so the manifest never points at a missing file.
            gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$file"
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$file"
            jq --slurpfile meta "$meta" --arg fp "$FP" --arg t "$target" --arg url "$url" \
               --arg commit "$CRE_SHORT" --arg base "$BASE" --arg ko "$KOREADER" --arg built "$built" \
               --arg repo "$CRENGINE_REPO" --arg ref "$REF" \
               '.crengine = {repo: $repo, ref: $ref, commit: $commit}
                | .builds[$fp][$t] = ($meta[0] | del(.target)) + {url: $url, commit: $commit,
                                                                  koreader: $ko, base: $base, built: $built}' \
               manifest.json > next.json
            mv next.json manifest.json
            echo "Published $target: $file"
          done
          cat manifest.json
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber manifest.json
          # Remove libraries the manifest no longer lists. (grep exits 1 when
          # nothing is left to remove, which isn't an error here.)
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | { grep '^libkoreader-cre-' || true; } \
            | { grep -vxF -f <(jq -r '.builds[][].file' manifest.json) || true; } \
            | while read -r name; do
                gh release delete-asset "$RELEASE_TAG" "$name" -R "$GITHUB_REPOSITORY" -y || true
              done
