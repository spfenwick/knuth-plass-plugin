# Builds KOReader's CREngine library (libkoreader-cre.so) from the
# knuth-plass-history branch of spfenwick/crengine, against the
# koreader-base of the latest KOReader nightly, and publishes it on the
# rolling "engine" release with a manifest.json the plugin's updater reads:
#
#   https://github.com/<repo>/releases/download/engine/manifest.json
#
#   { "schema": 2,
#     "crengine": {"repo": "...", "ref": "...", "commit": "<12 hex>"},
#     "builds": { "<fingerprint>": { "<target>": {
#         "file": "...", "url": "...", "sha256": "...", "size": n,
#         "commit": "<12 hex>", "koreader": "<nightly it was built for>",
#         "base": "<koreader-base commit>", "built": "<ISO time>" } } },
#     "bases": { "<koreader-base commit>": "<fingerprint>" } }
#
# The library only has to agree with the rest of KOReader where they meet:
# cre.cpp (the Lua API KOReader's frontend calls), its build options, and
# the shared libraries it links (of which only lunasvg, a C++ library
# without a versioned soname, can change incompatibly without failing to
# load). The fingerprint is a hash of those parts of koreader-base, so most
# new nightlies need no new build: their koreader-base is just recorded in
# "bases" as using the existing one. A device finds its koreader-base from
# the commit in its version (v2026.07.2-299-g8012773_… → 8012773); with no
# entry for it, the plugin falls back to the newest build and checks it
# against the running engine before installing.
name: Build engine

on:
  workflow_dispatch:
    inputs:
      koreader_ref:
        description: KOReader commit, tag or branch (empty for the latest nightly)
        required: false
      crengine_ref:
        description: spfenwick/crengine branch, tag or commit
        required: false
        default: knuth-plass-history
      force:
        description: Rebuild even if this build is already published
        type: boolean
        default: false
  # Sent by spfenwick/crengine on a push to knuth-plass-history.
  repository_dispatch:
    types: [crengine-updated]
  # Picks up nightlies with a new koreader-base (otherwise it stops early).
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  # To remove outdated build caches.
  actions: write

# Runs share the "engine" release and its manifest.
concurrency:
  group: engine-release
  cancel-in-progress: false

env:
  CRENGINE_REPO: spfenwick/crengine
  RELEASE_TAG: engine
  GH_TOKEN: ${{ github.token }}

jobs:
  kobo:
    runs-on: ubuntu-latest
    env:
      TARGET: kobo
      IMAGE: koreader/kokobo:latest
    steps:
      - name: Resolve versions
        id: v
        env:
          IN_KOREADER: ${{ inputs.koreader_ref }}
          IN_REF: ${{ inputs.crengine_ref || github.event.client_payload.ref || 'knuth-plass-history' }}
        run: |
          set -euo pipefail
          if [ -n "$IN_KOREADER" ]; then
            ko_ref=$IN_KOREADER
            ko_version=$IN_KOREADER
          else
            # The nightly KOReader's own updater would install.
            zsync="https://ota.koreader.rocks/koreader-$TARGET-latest-nightly.zsync"
            curl -fsSL --max-time 120 -o nightly.zsync "$zsync"
            name=$(sed -n '1,20{s/^Filename: //p}' nightly.zsync | head -1 | tr -d '\r')
            ko_version=${name#koreader-"$TARGET"-}
            ko_version=${ko_version%.targz}
            [[ $ko_version =~ -g([0-9a-f]{7,40})_ ]] || { echo "::error::no commit in nightly name: $name"; exit 1; }
            ko_ref=${BASH_REMATCH[1]}
          fi
          [[ $ko_ref =~ ^[0-9A-Za-z._/-]+$ ]] || { echo "::error::bad KOReader ref: $ko_ref"; exit 1; }
          ref=$IN_REF
          cre=$(gh api "repos/$CRENGINE_REPO/commits/$ref" --jq .sha)
          base=$(gh api "repos/koreader/koreader/contents/base?ref=$ko_ref" --jq .sha)
          # Git's ids of the parts of koreader-base the engine depends on.
          parts=$(
            {
              gh api "repos/koreader/koreader-base/contents?ref=$base" \
                --jq '.[] | select(.name == "cre.cpp" or .name == "cre.h") | .path + " " + .sha'
              gh api "repos/koreader/koreader-base/contents/cmake?ref=$base" \
                --jq '.[] | select(.name == "crengine") | .path + " " + .sha'
              gh api "repos/koreader/koreader-base/contents/thirdparty?ref=$base" \
                --jq '.[] | select(.name == "lunasvg") | .path + " " + .sha'
            } | sort
          )
          echo "$parts"
          [ "$(wc -l <<< "$parts")" -eq 4 ] || { echo "::error::koreader-base layout changed"; exit 1; }
          fp=$(sha256sum <<< "$parts" | cut -c1-16)
          echo "Building $TARGET: KOReader $ko_version (base $base, fingerprint $fp), crengine $ref @ $cre"
          {
            echo "fp=$fp"
            echo "koreader=$ko_version"
            echo "base=$base"
            echo "base_short=${base:0:12}"
            echo "ref=$ref"
            echo "cre=$cre"
            echo "cre_short=${cre:0:12}"
          } >> "$GITHUB_OUTPUT"

      # A build is needed when there's none of this crengine commit for this
      # fingerprint; otherwise at most the koreader-base is recorded.
      - name: Plan
        id: plan
        env:
          FORCE: ${{ inputs.force || false }}
          FP: ${{ steps.v.outputs.fp }}
          BASE: ${{ steps.v.outputs.base }}
          CRE_SHORT: ${{ steps.v.outputs.cre_short }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p manifest.json -O old.json 2>/dev/null \
            || echo '{}' > old.json
          # Builds listed by koreader-base (before schema 2) are dropped.
          jq -e '.schema == 2' old.json >/dev/null || echo '{"schema": 2}' > old.json
          published=$(jq -r --arg fp "$FP" --arg t "$TARGET" '.builds[$fp][$t].commit // ""' old.json)
          recorded=$(jq -r --arg base "$BASE" '.bases[$base] // ""' old.json)
          build=true
          if [ "$published" = "$CRE_SHORT" ] && [ "$FORCE" != "true" ]; then
            echo "Build $CRE_SHORT for fingerprint $FP is already published."
            build=false
          fi
          publish=$build
          [ "$recorded" = "$FP" ] || publish=true
          echo "build=$build publish=$publish"
          {
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      # The whole koreader-base tree (sources, crengine checkout and build
      # output) is kept between runs, per koreader-base commit: a new
      # crengine commit then only recompiles the files it changed. A new
      # koreader-base (or an evicted cache) starts from scratch, with
      # ccache's help.
      - name: Restore build tree
        if: steps.plan.outputs.build == 'true'
        id: tree
        uses: actions/cache/restore@v4
        with:
          path: base
          key: tree-${{ env.TARGET }}-${{ steps.v.outputs.base }}-${{ steps.v.outputs.cre }}
          restore-keys: |
            tree-${{ env.TARGET }}-${{ steps.v.outputs.base }}-

      - name: Restore compiler cache
        if: steps.plan.outputs.build == 'true' && steps.tree.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-${{ env.TARGET }}-${{ steps.v.outputs.base }}
          restore-keys: |
            ccache-${{ env.TARGET }}-

      - name: Check out koreader-base
        if: steps.plan.outputs.build == 'true' && steps.tree.outputs.cache-matched-key == ''
        uses: actions/checkout@v4
        with:
          repository: koreader/koreader-base
          ref: ${{ steps.v.outputs.base }}
          path: base

      # In place of base's crengine submodule (the only one it has). A git
      # checkout, so the engine's CMake can read the commit too; in a
      # restored tree, checking out the new commit only touches the files
      # it changed, so only those are rebuilt.
      - name: Check out the Knuth–Plass crengine
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          dir=base/thirdparty/kpvcrlib/crengine
          if [ ! -d "$dir/.git" ]; then
            rm -rf "$dir"
            git clone --filter=blob:none --no-checkout "https://github.com/$CRENGINE_REPO" "$dir"
          fi
          git -C "$dir" fetch --no-tags origin "${{ steps.v.outputs.cre }}"
          git -C "$dir" checkout --force --detach "${{ steps.v.outputs.cre }}"
          git -C "$dir" log --oneline -1

      - name: Build
        if: steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          mkdir -p ccache
          # Only the engine library and what it needs (crengine, its
          # libraries and LuaJIT), not all of KOReader's. The image's user
          # (ko) has the runner's uid, so it can write the checkout. A login
          # shell puts the toolchain on PATH.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/ko/ws" -w /home/ko/ws/base \
            -e CCACHE_DIR=/home/ko/ws/ccache -e CCACHE_MAXSIZE=2G \
            -e KNUTH_PLASS_BUILD="${{ steps.v.outputs.cre_short }}" \
            "$IMAGE" bash -lc "make TARGET=$TARGET koreader-cre -j$(nproc)"

      # Saved before packaging, so a later failure doesn't lose the build.
      - name: Save build tree
        if: steps.plan.outputs.build == 'true' && steps.tree.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: base
          key: tree-${{ env.TARGET }}-${{ steps.v.outputs.base }}-${{ steps.v.outputs.cre }}

      - name: Save compiler cache
        if: steps.plan.outputs.build == 'true' && steps.tree.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-${{ env.TARGET }}-${{ steps.v.outputs.base }}

      # Each crengine commit saves a new tree; keep only the newest.
      - name: Remove older build trees
        if: steps.plan.outputs.build == 'true' && steps.tree.outputs.cache-hit != 'true'
        env:
          KEEP: tree-${{ env.TARGET }}-${{ steps.v.outputs.base }}-${{ steps.v.outputs.cre }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "tree-$TARGET-" --limit 100 --json key --jq '.[].key' \
            | grep -vx "$KEEP" | while read -r key; do
                gh cache delete -R "$GITHUB_REPOSITORY" "$key" || true
              done

      - name: Package
        if: steps.plan.outputs.build == 'true'
        id: pkg
        run: |
          set -euo pipefail
          # Stripped, as KOReader installs it.
          lib=$(ls base/build/*/libs/libkoreader-cre.so)
          # The engine must report the commit it was built from.
          strings "$lib" | grep -qx "${{ steps.v.outputs.cre_short }}" \
            || { echo "::error::$lib does not contain the build commit"; exit 1; }
          # Uncompressed: the device installs it as it is (about 2 MB).
          file=libkoreader-cre-${{ steps.v.outputs.fp }}-$TARGET.so
          mkdir -p out
          cp "$lib" "out/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$lib" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "$lib")" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: steps.plan.outputs.publish == 'true'
        env:
          BUILT: ${{ steps.plan.outputs.build }}
          FP: ${{ steps.v.outputs.fp }}
          BASE: ${{ steps.v.outputs.base }}
          FILE: ${{ steps.pkg.outputs.file }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --prerelease \
              --title "Knuth–Plass engine builds" \
              --notes "CREngine builds for the plugin's updater. See manifest.json."
          fi
          mkdir -p out
          # This koreader-base uses this fingerprint's build.
          jq --arg base "$BASE" --arg fp "$FP" '.bases[$base] = $fp' old.json > out/manifest.json
          if [ "$BUILT" = "true" ]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$FILE"
            jq --arg repo "$CRENGINE_REPO" --arg ref "${{ steps.v.outputs.ref }}" \
               --arg commit "${{ steps.v.outputs.cre_short }}" \
               --arg fp "$FP" --arg base "$BASE" --arg ko "${{ steps.v.outputs.koreader }}" --arg t "$TARGET" \
               --arg file "$FILE" --arg url "$url" \
               --arg sha "${{ steps.pkg.outputs.sha256 }}" --argjson size "${{ steps.pkg.outputs.size }}" \
               --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
               '.crengine = {repo: $repo, ref: $ref, commit: $commit}
                | .builds[$fp][$t] = {file: $file, url: $url, sha256: $sha, size: $size,
                                      commit: $commit, koreader: $ko, base: $base, built: $built}' \
               out/manifest.json > out/next.json
            mv out/next.json out/manifest.json
            # The library first, so the manifest never points at a missing file.
            gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber "out/$FILE"
          fi
          cat out/manifest.json
          gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber out/manifest.json
          # Remove libraries the manifest no longer lists.
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep '^libkoreader-cre-' \
            | grep -vxF -f <(jq -r '.builds[][].file' out/manifest.json) \
            | while read -r name; do
                gh release delete-asset "$RELEASE_TAG" "$name" -R "$GITHUB_REPOSITORY" -y || true
              done
