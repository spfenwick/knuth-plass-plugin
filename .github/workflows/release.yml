# Publishes a plugin release for the updater, either
#
# - when a vX.Y.Z tag is pushed (it must match the version in _meta.lua), or
# - by hand (Actions → Release plugin → Run workflow, on main), which tags
#   the commit with the version in _meta.lua.
#
# The zip goes on the versioned release, and its plugin.json is also put on
# the rolling "knuthplass" release, where the updater finds it at
#
#   https://github.com/<repo>/releases/download/knuthplass/plugin.json
#
# (A fixed tag, so other releases in this repo can't hide it the way they
# could with "latest". Like "engine", it is a prerelease.)
name: Release plugin

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time.
concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *version = "\([0-9]*\.[0-9]*\.[0-9]*\)",$/\1/p' knuthplass.koplugin/_meta.lua)
          [ -n "$version" ] || { echo "::error::no version in _meta.lua"; exit 1; }
          tag="v$version"
          if [ "$EVENT" = "push" ]; then
            if [ "$tag" != "$REF_NAME" ]; then
              echo "::error::tag $REF_NAME does not match _meta.lua version $version"
              exit 1
            fi
          else
            if [ "$REF" != "refs/heads/main" ]; then
              echo "::error::run it on main (not $REF_NAME)"
              exit 1
            fi
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
                || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "::error::$tag already exists: bump version in _meta.lua first"
              exit 1
            fi
          fi
          echo "Releasing $tag"
          {
            echo "VERSION=$version"
            echo "TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y luajit
          sh scripts/test.sh

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          zip -qrX out/knuthplass.koplugin.zip knuthplass.koplugin
          sha=$(sha256sum out/knuthplass.koplugin.zip | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/knuthplass.koplugin.zip"
          jq -n --arg v "$VERSION" --arg url "$url" --arg sha "$sha" \
            '{version: $v, file: "knuthplass.koplugin.zip", url: $url, sha256: $sha}' \
            > out/plugin.json
          cat out/plugin.json

      # For a manual run this also creates the tag, on the commit tested.
      - name: Publish
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest --target "$GITHUB_SHA" \
            --title "Knuth–Plass justification $VERSION" --generate-notes \
            out/knuthplass.koplugin.zip out/plugin.json

      # Last, so the updater only sees plugin.json once the zip is up.
      - name: Point updater at it
        env:
          UPDATE_TAG: knuthplass
        run: |
          set -euo pipefail
          if ! gh release view "$UPDATE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$UPDATE_TAG" -R "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Knuth–Plass justification updates" \
              --notes "plugin.json for the plugin's updater; points at the newest vX.Y.Z release."
          fi
          gh release upload "$UPDATE_TAG" -R "$GITHUB_REPOSITORY" --clobber out/plugin.json
