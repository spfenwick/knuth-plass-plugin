# Publishes a plugin release for the updater when a vX.Y.Z tag is pushed.
# The tag must match the version in _meta.lua. The release becomes
# "latest", so the updater finds its plugin.json at
#
#   https://github.com/<repo>/releases/latest/download/plugin.json
#
# (The "engine" release is a prerelease, so it never counts as latest.)
name: Release plugin

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y luajit
          sh scripts/test.sh

      - name: Check version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *version = "\([0-9]*\.[0-9]*\.[0-9]*\)",$/\1/p' knuthplass.koplugin/_meta.lua)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match _meta.lua version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p out
          zip -qrX out/knuthplass.koplugin.zip knuthplass.koplugin
          sha=$(sha256sum out/knuthplass.koplugin.zip | cut -d' ' -f1)
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/knuthplass.koplugin.zip"
          jq -n --arg v "$VERSION" --arg url "$url" --arg sha "$sha" \
            '{version: $v, file: "knuthplass.koplugin.zip", url: $url, sha256: $sha}' \
            > out/plugin.json
          cat out/plugin.json

      - name: Publish
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest \
            --title "Knuth–Plass justification $VERSION" --generate-notes \
            out/knuthplass.koplugin.zip out/plugin.json
